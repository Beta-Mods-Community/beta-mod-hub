name: betamods

# Oracle Always Free deployment stack (Next.js + ClamAV + Caddy).
#
# Startup is fail-closed: nothing serves until ClamAV answers.
#   app    waits for clamav  (service_healthy) — clamd must be scanning
#   caddy  waits for app     (service_healthy) — no traffic before the app
#          is ready. If clamd never becomes healthy the app never starts;
#          if it dies mid-run, uploads 503 instead of skipping the scan.
#
# Health checks:
#   app    Dockerfile HEALTHCHECK (HTTP GET :3000 via wget).
#   clamav image ships a built-in `clamdcheck.sh` (clamd PING -> PONG) with a
#         6-minute start period for the first signature download — mirrored
#         explicitly below so the timing is visible in this file.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: "3000"
      STORAGE_DRIVER: local
      SCAN_ENDPOINT: http://127.0.0.1:3311
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    volumes:
      - app-data:/app/data
    expose:
      - "3000"
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    build:
      context: deploy/clamav
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 6m
      retries: 3
    volumes:
      - clamav-db:/var/lib/clamav
    expose:
      - "3310"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
  clamav-db:
  caddy-data:
  caddy-config: