# clamd sidecar config — limits raised to match the app's
# 512 MiB upload cap (lib/scan.ts + scripts/scan-server.mjs MAX_BYTES).
# Built into deploy/clamav/ so the sidecar behaves like dev clamd.

LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

StreamMaxLength 512M
MaxScanSize 1024M
MaxFileSize 512M
MaxFiles 15000

MaxThreads 4
MaxQueue 20
MaxConnectionQueueLength 30

LogTime true
LogClean false
LogVerbose false

ExitOnOOM true
Foreground true

# OnConnect 300
# OnDisconnect 30
# OnExec 30

SelfCheck 600

# The default signatures load from the image's database (freshclam-managed).
DatabaseDirectory /var/lib/clamav
PidFile /var/run/clamav/clamd.pid
